name: Release

# Reviewed releases (flow 3): work lands on dev, the version is the topmost heading of
# CHANGELOG.md. Every push to dev publishes a release candidate (X.Y.Z-rc.N); merging the
# release pull request (dev -> main) publishes X.Y.Z. See .relctl.yaml.
on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "docs/**"

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

# Release runs must not overlap: two runs computing the next version at the same
# time would create duplicate releases for the same version. A run that is still
# queued when a newer commit arrives is superseded by it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Test – a candidate must mean "this commit passed"
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: make test

  # ──────────────────────────────────────────────────────────────────────────────
  # Create Release – a candidate on dev, the release on main.
  # Outputs stay empty when there is nothing to publish (version already released).
  # ──────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      version: ${{ steps.release.outputs.RELCTL_VERSION }}
      release-id: ${{ steps.release.outputs.RELCTL_RELEASE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup relctl
        uses: layer87-labs/relctl-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        id: release
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            relctl release create --prerelease --merge-sha "${GITHUB_SHA}"
          else
            relctl release create --merge-sha "${GITHUB_SHA}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Phase A – Build, sign, SBOM
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Sign (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [create-release]
    if: needs.create-release.outputs.release-id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.create-release.outputs.version }}
          COMMIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: make build/single SUFFIX=${{ matrix.suffix }} EXT=${{ matrix.ext }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign binary (keyless via OIDC)
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          BINARY="build/package/relctl_${VERSION}_${{ matrix.suffix }}${{ matrix.ext }}"
          cosign sign-blob \
            --yes \
            --bundle "${BINARY}.bundle" \
            "${BINARY}"

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX)
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          BINARY="build/package/relctl_${VERSION}_${{ matrix.suffix }}${{ matrix.ext }}"
          syft "${BINARY}" \
            -o spdx-json \
            --file "build/package/relctl_${VERSION}_${{ matrix.suffix }}.sbom.spdx.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: relctl-${{ matrix.suffix }}
          path: build/package/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────────
  # Phase A (continued) – Checksums
  # ──────────────────────────────────────────────────────────────────────────────
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: relctl-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum relctl_* > sha256sum.txt
          cat sha256sum.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: relctl-checksums
          path: dist/sha256sum.txt
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────────
  # Phase B – Publish Release
  # ──────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [create-release, build, checksums]
    environment: ${{ github.ref_name == 'main' && 'production' || 'candidate' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup relctl
        uses: layer87-labs/relctl-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: relctl-*
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish Release assets
        run: |
          ASSETS=()
          while IFS= read -r f; do
            ASSETS+=("--asset" "file=${f}")
          done < <(find dist/ -type f | sort)
          relctl release publish \
            --release-id "${{ needs.create-release.outputs.release-id }}" \
            "${ASSETS[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Forward – bring main (merge commit, dated changelog heading) back into dev
  # ──────────────────────────────────────────────────────────────────────────────
  forward:
    name: Forward main into dev
    runs-on: ubuntu-latest
    needs: [create-release, publish-release]
    if: always() && github.ref_name == 'main' && needs.create-release.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup relctl
        uses: layer87-labs/relctl-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Forward
        run: relctl release forward
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Phase C – Post-Release (placeholders, not yet active)
  # ──────────────────────────────────────────────────────────────────────────────

